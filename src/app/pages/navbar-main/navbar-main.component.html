<nav class="navbar navbar-expand-lg studio-navbar sticky-top shadow-sm">
  <div class="container-fluid px-3 px-md-4 px-lg-5 d-flex align-items-center justify-content-between">
    <!-- Brand: Sleek Studio Logo Mark (Scrolls to top / routes to home) -->
    <a
      class="navbar-brand d-flex align-items-center me-auto"
      routerLink="/"
      (click)="onLogoClick($event)"
      aria-label="Side A Home"
    >
      <img
        src="../../../assets/images/logo/side_a_logo1.png"
        alt="Side A Logo"
        class="brand-logo"
      >
    </a>

    <!-- Navbar Toggler Button -->
    <button class="navbar-toggler border-0" type="button" (click)="toggleNavbar()" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>

    <!-- Collapsible Navbar: Navigation Links (Right Aligned) -->
    <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
      <ul class="navbar-nav align-items-center gap-1 ms-auto">
        <li class="nav-item">
          <a
            class="nav-link"
            routerLink="/"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: true }"
            (click)="onHomeClick($event)"
          >
            Home
          </a>
        </li>

        <li class="nav-item">
          <a
            class="nav-link"
            [routerLink]="['/projects']"
            [queryParams]="{ category: 'All' }"
            [class.active]="router.url.startsWith('/projects')"
            (click)="onProjectsClick($event)"
          >
            Projects
          </a>
        </li>

        <li class="nav-item">
          <a
            class="nav-link"
            routerLink="/about"
            routerLinkActive="active"
            (click)="onAboutClick($event)"
          >
            About Us
          </a>
        </li>
      </ul>
    </div>
  </div>
</nav>
