<div class="container mt-5" *ngIf="project">
  <h2 class="text-secondary">{{ project.title }}</h2>

  <div class="cover-wrapper mb-4">
    <img
      [src]="project.imageUrl"
      [alt]="project.title"
      class="cover-image"
    >
  </div>

  <p class="text-muted">{{ project.description }}</p>
  <p class="text-muted">{{ project?.notes }}</p>
</div>

<div class="row mt-4">
  <div class="col-md-6 mb-4" *ngFor="let img of validImages">
    <div class="image-wrapper">
      <img
        [src]="img"
        alt="Project image"
        class="project-image"
      >
    </div>
  </div>
</div>
