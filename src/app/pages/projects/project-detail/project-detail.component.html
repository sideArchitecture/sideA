<div class="container mt-5 project-profile" *ngIf="project">
  <div class="row align-items-center">
    <!-- Cover Image -->
    <div class="col-md-4 text-center">
      <img
        [src]="project.imageUrl"
        [alt]="project.title"
        class="img-fluid project-cover shadow-sm"
      >
    </div>

    <!-- Project Details -->
    <div class="col-md-8">
      <h2 class="text-secondary">{{ project.title }}</h2>
      <p class="text-secondary justify-text custom-text">
        {{ project.description }}
      </p>
    </div>
  </div>
</div>

<!-- Project Notes -->
<div class="container mt-4" *ngIf="project?.notes">
  <p class="text-muted">{{ project?.notes }}</p>
</div>

<!-- Project Images -->
<div class="container mt-4">
  <div class="row">
    <div class="col-md-6 mb-4" *ngFor="let img of validImages; let i = index">
      <div class="image-wrapper" (click)="openLightbox(i)">
        <img
          [src]="img"
          alt="Project image"
          class="project-image"
        >
      </div>
    </div>
  </div>
</div>

<!-- Lightbox Viewer -->
<div class="lightbox-overlay" *ngIf="selectedImageIndex !== null">
  <div class="lightbox-content">
    <button class="lightbox-close" (click)="closeLightbox()">×</button>

    <button class="lightbox-nav left" (click)="prevImage()" [disabled]="selectedImageIndex === 0">‹</button>

    <img [src]="validImages[selectedImageIndex!]" alt="Full view" class="lightbox-image">

    <button class="lightbox-nav right" (click)="nextImage()" [disabled]="selectedImageIndex === validImages.length - 1">›</button>
  </div>
</div>
