<span class="float-end">
  <a class="text-secondary"
     [routerLink]="['/projects']"
     [queryParams]="{ category: selectedCategory }">
    <i class="bi bi-arrow-left-circle-fill"></i>
    Back
  </a>

</span>

<div *ngIf="isLoading" class="text-center mt-5">
  <p class="text-muted">Loading project details...</p>
</div>

<div class="container mt-5 project-profile" *ngIf="project && !isLoading">
  <div class="row align-items-center">
    <div class="col-md-4 text-center">
      <img
        [src]="project.imageUrl"
        [alt]="project.title"
        class="img-fluid project-cover shadow-sm"
      >
    </div>
    <div class="col-md-8">
      <h2 class="text-secondary">{{ project.title }}</h2>
      <p class="text-secondary justify-text custom-text">
        {{ project.description }}
      </p>
    </div>
  </div>
</div>

<div class="container mt-4" *ngIf="project?.notes">
  <p class="text-muted">{{ project?.notes }}</p>
</div>

<div class="container mt-4" *ngIf="validImages.length > 0">
  <div class="row">
    <div class="col-md-6 mb-4" *ngFor="let img of validImages; let i = index">
      <div class="image-wrapper" (click)="openLightbox(i)">
        <img [src]="img" alt="Project image" class="project-image">
      </div>
    </div>
  </div>
</div>

<div class="lightbox-overlay"
     *ngIf="selectedImageIndex !== null"
     (swipeleft)="nextImage()"
     (swiperight)="prevImage()">
  <div class="lightbox-content">
    <button class="lightbox-close" (click)="closeLightbox()">×</button>
    <button class="lightbox-nav-side left" (click)="prevImage()" [disabled]="selectedImageIndex === 0">‹</button>
    <button class="lightbox-nav-side right" (click)="nextImage()" [disabled]="selectedImageIndex === validImages.length - 1">›</button>

    <pinch-zoom #zoomRef [disablePan]="false">
      <img [src]="validImages[selectedImageIndex!]" alt="Full view" class="lightbox-image">
    </pinch-zoom>

    <div class="lightbox-nav-row">
      <button class="lightbox-nav-bottom" (click)="prevImage()" [disabled]="selectedImageIndex === 0">‹</button>
      <button class="lightbox-nav-bottom" (click)="nextImage()" [disabled]="selectedImageIndex === validImages.length - 1">›</button>
    </div>
  </div>
</div>

<div class="text-center mt-5" *ngIf="validImages.length > 5">

<a class="text-secondary"
   [routerLink]="['/projects']"
   [queryParams]="{ category: selectedCategory }">
  <i class="bi bi-arrow-left-circle-fill"></i>
  Back
</a>
</div>
