<div class="container mt-5">
  <div class="row mb-4">
    <div class="col-md-4">
      <div class="position-relative">
        <input
          type="text"
          class="form-control"
          [(ngModel)]="searchTerm"
          (input)="filterCategoryOptions()"
          (click)="onInputClick()"
          placeholder="Search category / projects"
        />


        <ul class="list-group position-absolute w-100 z-3" *ngIf="showDropdown">
          <li class="list-group-item fw-bold text-muted" *ngIf="visibleCategories.length > 0">
            Categories:
<!--            &nbsp;-->
<!--            <i class="bi bi-tag text-secondary"></i>-->
          </li>

          <ng-container *ngFor="let item of combinedResults">
            <li
              class="list-group-item list-group-item-action"
              *ngIf="item.type === 'category'"
              (click)="selectCategory(item)"
            >
              {{ getCategoryLabel(item.value) }}
            </li>
          </ng-container>

          <li class="list-group-item fw-bold text-muted mt-2" *ngIf="visibleProjects.length > 0">
            Projects:
<!--            &nbsp;-->
<!--            <i class="bi bi-briefcase text-secondary"></i>-->

          </li>

          <ng-container *ngFor="let item of combinedResults">
            <li
              class="list-group-item list-group-item-action"
              *ngIf="item.type === 'project'"
              (click)="selectCategory(item)"
            >
              {{ item.value.title }}
            </li>
          </ng-container>
        </ul>


      </div>

    </div>
  </div>

  <div class="row">
    <div
      class="col-md-4 mb-4"
      *ngFor="let project of projects"
    >
      <a [routerLink]="['/projects', project.id]" [queryParams]="{ category: selectedCategory }" class="text-decoration-none">

        <div class="card h-100 shadow-sm">
          <div class="square-wrapper">
            <img
              [src]="project.imageUrl"
              [alt]="project.title"
              class="square-image"
            >
          </div>
          <div class="card-body text-center">
            <h5 class="card-title text-secondary">{{ project.title }}</h5>
          </div>
        </div>
      </a>
    </div>
  </div>
</div>
