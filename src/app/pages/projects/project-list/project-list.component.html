
<div class="container mt-5" *ngIf="isLoading == false">
  <div class="row mb-4">
    <div class="col-md-4">
      <label class="form-label fw-semibold mb-2">Select Category1:</label>

      <div class="position-relative">
        <ng-container *ngIf="isSearchProjectsEnabled(); else simpleDropdown">
          <input
            type="text"
            class="form-control"
            [(ngModel)]="searchTerm"
            (input)="filterCategoryOptions()"
            (click)="onInputClick()"
            placeholder="Search category / projects"
          />

          <ul class="list-group position-absolute w-100 z-3" *ngIf="showDropdown">
            <li class="list-group-item fw-bold text-muted" *ngIf="visibleCategories.length > 0">
<!--              <i class="bi bi-tags me-2"></i>-->
              Categories:
            </li>
            <ng-container *ngFor="let item of combinedResults">
              <li
                class="list-group-item list-group-item-action"
                *ngIf="item.type === 'category'"
                (click)="selectCategory(item)"
              >
                <i class="bi bi-tags me-2 text-secondary"></i>
                {{ getCategoryLabel(item.value) }}
              </li>
            </ng-container>

            <li class="list-group-item fw-bold text-muted mt-2" *ngIf="visibleProjects.length > 0">
<!--              <i class="bi bi-building me-2"></i>-->
              Projects:
            </li>
            <ng-container *ngFor="let item of combinedResults">
              <li
                class="list-group-item list-group-item-action"
                *ngIf="item.type === 'project'"
                (click)="selectCategory(item)"
              >
                <i class="bi bi-building me-2 text-secondary"></i>

                {{ item.value.title }}

                <span class="float-end">
                  <i class="bi bi-arrow-up-right-circle-fill"></i>
                </span>
              </li>
            </ng-container>
          </ul>
        </ng-container>

        <ng-template #simpleDropdown>
          <select class="form-select" [(ngModel)]="selectedCategory" (change)="selectCategory({ type: 'category', value: selectedCategory })">
            <option *ngFor="let cat of filteredCategories" [value]="cat">
              {{ getCategoryLabel(cat) }}
            </option>
          </select>
        </ng-template>
      </div>
    </div>
  </div>

  <div class="row">
    <div class="col-md-4 mb-4" *ngFor="let project of projects">
      <div
        class="card h-100 shadow-sm"
        [class.highlighted]="project.id === highlightedProjectId"
        (click)="navigateToProject(project)"
      >
        <div class="square-wrapper">
          <img
            [src]="getCoverImageUrl(project.coverImage)"
            [alt]="project.title"
            class="square-image"
          />
        </div>
        <div class="card-body text-center">
          <h5 class="card-title text-secondary">{{ project.title  }}</h5>
        </div>
      </div>
    </div>
  </div>

</div>


<div *ngIf="isLoading == true">

  <br/>
  <br/>





  <div class="container text-muted"><h5>Loading, Please wait..
<!--    <span class="spinner-border text-secondary" role="status">-->
<!--      <span class="visually-hidden">Loading...</span>-->
<!--    </span>-->

    <div class="spinner-grow text-secondary" role="status">
      <span class="visually-hidden">Loading...</span>
    </div>

  </h5>
  </div>

</div>
