<div class="hero-carousel-wrapper position-relative">
  <div
    #carouselRef
    id="heroArchitecturalCarousel"
    class="carousel slide carousel-fade shadow-lg"
    data-bs-ride="carousel"
    data-bs-interval="6000"
    data-bs-pause="hover"
    (touchstart)="onTouchStart($event)"
    (touchend)="onTouchEnd($event)"
  >
    <!-- Slide Counter Badge (Top Right) -->
    <div class="carousel-counter-badge position-absolute d-none d-md-flex align-items-center">
      <span class="current-num">{{ (activeIndex + 1) | number: '2.0-0' }}</span>
      <span class="divider">/</span>
      <span class="total-num">{{ slides.length | number: '2.0-0' }}</span>
    </div>

    <!-- Carousel Inner -->
    <div class="carousel-inner rounded-4 overflow-hidden">
      <div
        *ngFor="let slide of slides; let i = index"
        class="carousel-item"
        [class.active]="i === 0"
      >
        <div class="hero-slide-container">
          <!-- Slide Image with Ken Burns animation -->
          <img
            [src]="slide.imageUrl"
            class="hero-slide-image d-block w-100"
            [alt]="slide.title"
          />

          <!-- Gradient Scrim for Readability -->
          <div class="hero-overlay-scrim"></div>

          <!-- Slide Content Overlay -->
          <div class="hero-slide-caption position-absolute text-start">
            <div class="caption-inner">
              <div class="slide-meta mb-2 d-flex align-items-center gap-2 flex-wrap">
                <span class="badge bg-white bg-opacity-25 text-white px-3 py-2 text-uppercase letter-spacing-1">
                  {{ slide.category }}
                </span>
                <span *ngIf="slide.location" class="location-tag text-white-50 small d-none d-sm-inline-flex align-items-center gap-1">
                  <i class="bi bi-geo-alt"></i> {{ slide.location }}
                </span>
                <span *ngIf="slide.year" class="year-tag text-white-50 small d-none d-sm-inline-flex align-items-center gap-1">
                  &bull; {{ slide.year }}
                </span>
                <span *ngIf="slide.builtStatus" class="status-tag text-white-50 small d-none d-md-inline-flex align-items-center gap-1">
                  &bull; {{ slide.builtStatus }}
                </span>
              </div>

              <h2 class="slide-title text-white fw-bold display-6 mb-2">
                <a [routerLink]="getProjectRoute(slide)" [queryParams]="{ category: 'All' }" class="text-white text-decoration-none slide-title-link">
                  {{ slide.title }}
                </a>
              </h2>

              <p *ngIf="slide.description" class="slide-description text-white-50 lead mb-3 d-none d-md-block">
                {{ slide.description }}
              </p>

              <div class="slide-actions d-flex align-items-center gap-3 pt-1">
                <a
                  [routerLink]="getProjectRoute(slide)"
                  [queryParams]="{ category: 'All' }"
                  class="btn btn-light rounded-pill px-4 py-2 fw-medium d-inline-flex align-items-center gap-2 btn-explore shadow-sm"
                >
                  <span>View Project</span>
                  <i class="bi bi-arrow-right"></i>
                </a>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Minimal Indicators (Bottom Center) -->
    <div class="carousel-indicators custom-indicators mb-3">
      <button
        *ngFor="let slide of slides; let i = index"
        type="button"
        data-bs-target="#heroArchitecturalCarousel"
        [attr.data-bs-slide-to]="i"
        [class.active]="i === activeIndex"
        [attr.aria-current]="i === activeIndex ? 'true' : null"
        [attr.aria-label]="'Slide ' + (i + 1)"
        class="custom-indicator-pill"
      ></button>
    </div>

    <!-- Floating Navigation Arrows -->
    <button
      class="carousel-control-prev custom-nav-btn"
      type="button"
      data-bs-target="#heroArchitecturalCarousel"
      data-bs-slide="prev"
      aria-label="Previous Project"
    >
      <div class="nav-btn-circle">
        <i class="bi bi-chevron-left" aria-hidden="true"></i>
      </div>
    </button>

    <button
      class="carousel-control-next custom-nav-btn"
      type="button"
      data-bs-target="#heroArchitecturalCarousel"
      data-bs-slide="next"
      aria-label="Next Project"
    >
      <div class="nav-btn-circle">
        <i class="bi bi-chevron-right" aria-hidden="true"></i>
      </div>
    </button>
  </div>
</div>
